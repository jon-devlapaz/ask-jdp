name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_SECRET: ci-only-session-secret-that-is-not-used-in-production
      SOCRATINK_API_KEY: ci-placeholder-not-used-by-offline-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
